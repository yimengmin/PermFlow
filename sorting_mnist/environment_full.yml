# Full export of the environment used for the paper (renamed to permflow).
# For a minimal setup use environment.yml with setup_env.sh instead.
# torch-linear-assignment (GPU Hungarian rounding at inference) is built after
# creating the env, with CUDA_HOME pointing to a CUDA 12.4 toolkit:
#   pip install --no-build-isolation --no-cache-dir torch-linear-assignment==0.0.5
