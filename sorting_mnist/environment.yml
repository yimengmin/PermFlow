# Environment for the PermFlow code (same versions as used for the paper).
# Use setup_env.sh, which also builds torch-linear-assignment (GPU Hungarian
# rounding used for inference) against this PyTorch; it needs a GPU node.
name: permflow
channels:
  - nvidia/label/cuda-12.4.1
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9.21
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cuda-nvcc=12.4          # compiler + headers to build torch-linear-assignment's CUDA kernel
  - cuda-cudart-dev=12.4
  - cuda-libraries-dev=12.4
  - gxx=11.4.0
  - scipy=1.13.1
  - pip=25.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - numpy==2.0.2
      - torchvision==0.20.1+cu124
